workflows:
  ios-testflight:
    name: AP Planet iOS
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_app_store   # name of the API key you add in Codemagic (Teams/Personal > Integrations)
    environment:
      groups:
        - supabase            # variable group holding your Supabase keys (create in Codemagic)
      vars:
        BUNDLE_ID: "com.applanet.app"
        APP_STORE_APPLE_ID: 6797276658          # <-- replace with the Apple ID number of your app record
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: |
          # Supabase creds come from the "supabase" variable group
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          npm run build
      - name: Generate iOS project (Capacitor)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Set bundle id & signing
        script: |
          cd ios/App
          # Codemagic auto-configures signing from the App Store Connect integration
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          # Use Codemagic's build number so each upload is unique
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
